<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Service</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

  
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background-color: #0d6efd;
      color: white;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 16px;
    }

    .user {
      font-weight: bold;
    }


    .hero {
      display: flex;
      height: 90vh; 
      width: 100%;
      align-items: center;
      justify-content: space-around;
      padding: 40px;
    }

    .hero-left {
      width: 45%;
    }

    .hero-left h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #333;
    }

    .hero-left p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #555;
    }

    .hero-left button {
      padding: 12px 25px;
      font-size: 16px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .hero-left button:hover {
      background-color: #084298;
    }

    .hero-right {
      width: 45%;
    }

    .hero-right img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

  </style>
</head>
<body>


  <div class="navbar">
    <div class="logo">Welcome Laundry</div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About Us</a>
      <a href="#">Contact Us</a>
    </div>

    <div class="user">Hello, User</div>
  </div>


  <div class="hero">
    

    <div class="hero-left">
      <h1>Fresh Clothes, Anytime.</h1>
      <h1>Clean Clothes, Happy Souls.</h1>
      <p>
        Experience hassle-free laundry services at your doorstep.
        Fast pickup, expert cleaning, and quick delivery.
      </p>
      <button>Book a Service Today</button>
    </div>


    <div class="hero-right">
      <img src="https://t3.ftcdn.net/jpg/06/27/91/98/360_F_627919849_agqpVWWR5ODdrFRD02Hj1e9kGwxymiQe.jpg" alt="Laundry Service">
    </div>

  </div>

</body>
</html>
